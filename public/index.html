<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pear / Holepunch Browser-to-Browser UDX P2P Chat</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #131a22;
      --border: #253140;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #a3e635;
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      color: var(--accent);
    }
    .badge {
      font-size: 12px;
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--cyan);
    }
    .controls, .stats {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      align-items: end;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    input {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px;
      font-family: inherit;
      font-size: 13px;
    }
    button {
      background: var(--accent);
      color: #0b0f14;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .stat-item {
      font-size: 12px;
    }
    .stat-item span {
      color: var(--accent);
      font-weight: 600;
    }
    #messages {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 280px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-row {
      font-size: 13px;
      line-height: 1.4;
    }
    .msg-meta {
      color: var(--cyan);
      margin-right: 6px;
    }
    .composer {
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍐 Pear P2P Chat (100% Client-Side Browser UDX + Hyperswarm + Protomux)</h1>
      <div class="badge" id="swarm-status">idle</div>
    </header>

    <div class="controls">
      <label>
        Nickname
        <input id="nick-input" type="text" placeholder="Alice" />
      </label>
      <label>
        DHT Bootstrap (host:port)
        <input id="bootstrap-input" type="text" placeholder="127.0.0.1:49737" />
      </label>
      <label>
        Swarm Room Topic
        <input id="topic-input" type="text" placeholder="pear-browser-chat" />
      </label>
      <button id="join-btn" type="button">Join Swarm</button>
    </div>

    <div class="stats">
      <div class="stat-item">Noise Ed25519 Key: <span id="local-pubkey">—</span></div>
      <div class="stat-item">Swarm Peers: <span id="peer-count">0</span></div>
      <div class="stat-item">UDX (0xff 0x01) Frames: <span id="udx-stats">TX: 0 | RX: 0</span></div>
      <div class="stat-item">Direct Browser P2P: <span id="p2p-stats">Links: 0 | TX: 0 | RX: 0</span></div>
    </div>

    <div id="messages"></div>

    <div class="composer">
      <input id="msg-input" type="text" placeholder="Send encrypted P2P message over UDX + Noise + Protomux..." />
      <button id="send-btn" type="button">Send P2P</button>
    </div>
  </div>

  <script type="module" src="./bundle.js"></script>
</body>
</html>
