<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pear / Holepunch Browser-to-Browser UDX P2P Chat</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #131a22;
      --border: #253140;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #a3e635;
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 16px;
    }
    .container {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      color: var(--accent);
    }
    .badge {
      font-size: 12px;
      background: #1e293b;
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--cyan);
    }
    .controls, .stats, .pairing {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      align-items: end;
    }
    .pairing {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    .pairing input {
      flex: 1;
      min-width: 180px;
    }
    #qr-panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 16px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }
    #qr-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }
    #qr-subtitle {
      font-size: 12px;
      color: var(--muted);
      max-width: 520px;
    }
    #qr-svg-box {
      width: 230px;
      height: 230px;
      background: #fff;
      padding: 6px;
      border-radius: 6px;
    }
    #qr-svg-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    #qr-video {
      display: none;
      width: 240px;
      border-radius: 6px;
      border: 1px solid var(--cyan);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    input {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px;
      font-family: inherit;
      font-size: 13px;
    }
    button {
      background: var(--accent);
      color: #0b0f14;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    button.secondary {
      background: #1e293b;
      color: var(--cyan);
      border: 1px solid var(--border);
    }
    .stat-item {
      font-size: 12px;
    }
    .stat-item span {
      color: var(--accent);
      font-weight: 600;
    }
    #messages {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 250px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-row {
      font-size: 13px;
      line-height: 1.4;
    }
    .msg-meta {
      color: var(--cyan);
      margin-right: 6px;
    }
    .composer {
      display: flex;
      gap: 8px;
    }
    .composer input {
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍐 Pear P2P Chat (100% Client-Side Browser UDX + Hyperswarm + Protomux)</h1>
      <div class="badge" id="swarm-status">idle</div>
    </header>

    <div class="controls">
      <label>
        Nickname
        <input id="nick-input" type="text" placeholder="Alice" />
      </label>
      <label>
        DHT Bootstrap (host:port or serverless)
        <input id="bootstrap-input" type="text" placeholder="127.0.0.1:49737" />
      </label>
      <label>
        Swarm Room Topic
        <input id="topic-input" type="text" placeholder="pear-room-1" />
      </label>
      <button id="join-btn" type="button">Join DHT Swarm</button>
    </div>

    <div class="pairing">
      <button id="create-invite-btn" type="button">📱 1. Show Invite QR</button>
      <input id="invite-box" type="text" placeholder="Scan QR or paste compact ~155-char invite/answer token..." />
      <button id="copy-invite-btn" class="secondary" type="button">Copy Token</button>
      <button id="scan-qr-btn" class="secondary" type="button">📷 Scan QR</button>
      <button id="accept-invite-btn" class="secondary" type="button">2. Accept Token</button>
    </div>

    <div id="qr-panel">
      <div id="qr-title">Scan Invite QR on Phone</div>
      <div id="qr-subtitle"></div>
      <div id="qr-svg-box"></div>
      <video id="qr-video" playsinline muted></video>
      <button id="close-qr-btn" class="secondary" type="button">Hide QR</button>
    </div>

    <div class="stats">
      <div class="stat-item">Noise Ed25519 Key: <span id="local-pubkey">—</span></div>
      <div class="stat-item">Swarm Peers: <span id="peer-count">0</span></div>
      <div class="stat-item">UDX (0xff 0x01) Frames: <span id="udx-stats">TX: 0 | RX: 0</span></div>
      <div class="stat-item">Direct Browser P2P: <span id="p2p-stats">Links: 0 | TX: 0 | RX: 0</span></div>
    </div>

    <div id="messages"></div>

    <div id="composer" class="composer">
      <input id="msg-input" type="text" placeholder="Send encrypted P2P message over UDX + Noise + Protomux..." />
      <button id="send-btn" type="button">Send P2P</button>
    </div>
  </div>

  <script type="module" src="./bundle.js"></script>
</body>
</html>
